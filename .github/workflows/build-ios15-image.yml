name: Build custom image

# Builds the iOS 15 compatibility fork and pushes it to GHCR.
#
# The frontend must be built before `docker build`: `pnpm release` writes to
# server/frontend/dist, which scripts/Dockerfile expects to already exist
# because frontend.go embeds it via `//go:embed dist/*`.

on:
  push:
    branches: [ios15-compat, "upgrade/ios15-*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "11.0.1"

jobs:
  build:
    name: Verify frontend and build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.2.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check frontend types and lint
        working-directory: web
        run: pnpm lint

      - name: Run frontend tests
        working-directory: web
        run: pnpm test

      - name: Build frontend release assets
        working-directory: web
        run: pnpm release

      - name: Check iOS 15 bundle syntax
        working-directory: web
        run: pnpm check:ios15

      - name: Resolve image metadata
        id: meta
        run: |
          # GHCR requires a lowercase namespace; GitHub usernames may have caps.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.["."]' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/ios15-compat'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/ios15-compat' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/memos:ios15
            ghcr.io/${{ steps.meta.outputs.owner }}/memos:${{ steps.meta.outputs.version }}-ios15.${{ github.run_number }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.ref == 'refs/heads/ios15-compat'
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "ghcr.io/${{ steps.meta.outputs.owner }}/memos:ios15"
            echo "ghcr.io/${{ steps.meta.outputs.owner }}/memos:${{ steps.meta.outputs.version }}-ios15.${{ github.run_number }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
